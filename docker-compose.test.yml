version: '3.9'

services:
  # Base de données PostgreSQL pour les tests
  test-postgres:
    image: postgres:15-alpine
    container_name: test_postgres
    ports:
      - '5433:5432'
    volumes:
      - test_postgres_data:/var/lib/postgresql/data
    networks:
      - gazette-test-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d gazette_test"]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: gazette_test

  # Backend - Tests
  test-backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile.test
    container_name: test_backend
    depends_on:
      test-postgres:
        condition: service_healthy
    environment:
      NODE_ENV: test
      DB_HOST: test-postgres
      DB_PORT: 5432
      DB_USER: test_user
      DB_PASSWORD: test_password
      DB_NAME: gazette_test
      JWT_SECRET: test_secret_key_very_long_and_secure
      CORS_ORIGIN: http://localhost:3002
    networks:
      - gazette-test-network
    ports:
      - '3001:3001'
    volumes:
      # Montage pour les tests en mode watch si besoin
      - ./apps/backend/src:/gazette/apps/backend/src:ro
      - ./apps/backend/test:/gazette/apps/backend/test:ro
      - ./packages/shared:/gazette/packages/shared:ro
    command: >
      sh -c "
        echo 'Waiting for database...' &&
        while ! nc -z test-postgres 5432; do sleep 1; done &&
        echo 'Database is ready!' &&
        echo 'Setting up database schema...' &&
        pnpm run schema:fresh &&
        echo 'Running backend tests...' &&
        pnpm test --watchAll=false --ci --coverage
      "

        # Backend CLI pour lancer migrations/seeds à la main
  test-backend-cli:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile.test
    container_name: test_backend_cli
    depends_on:
      test-postgres:
        condition: service_healthy
    environment:
      NODE_ENV: test
      DB_HOST: test-postgres
      DB_PORT: 5432
      DB_USER: test_user
      DB_PASSWORD: test_password
      DB_NAME: gazette_test
    networks:
      - gazette-test-network
    volumes:
      - ./apps/backend/src:/gazette/apps/backend/src
      - ./apps/backend/test:/gazette/apps/backend/test
      - ./packages/shared:/gazette/packages/shared
    command: sh -c "tail -f /dev/null" # reste actif pour que tu puisses exec dedans


  # Frontend - Tests
  test-frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile.test
    container_name: test_frontend
    depends_on:
      - test-backend
    environment:
      NODE_ENV: test
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_API_URL: http://test-backend:3001
    networks:
      - gazette-test-network
    ports:
      - '3003:3000'
    volumes:
      # Montage pour les tests en mode watch si besoin
      - ./apps/frontend/src:/gazette/apps/frontend/src:ro
      - ./apps/frontend/__tests__:/gazette/apps/frontend/__tests__:ro
      - ./apps/frontend/cypress:/gazette/apps/frontend/cypress:ro
      - ./packages/shared:/gazette/packages/shared:ro
    command: >
      sh -c "
        echo 'Running frontend tests...' &&
        pnpm jest --watchAll=false --ci --coverage
      "

  # Service pour les tests E2E (optionnel)
  test-e2e:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile.test
    container_name: test_e2e
    depends_on:
      - test-backend
      - test-frontend
    environment:
      NODE_ENV: test
      CYPRESS_BASE_URL: http://test-frontend:3000
      CYPRESS_API_URL: http://test-backend:3001
    networks:
      - gazette-test-network
    volumes:
      - ./apps/frontend/cypress:/gazette/apps/frontend/cypress:ro
      - ./cypress-results:/gazette/apps/frontend/cypress/results
    command: >
      sh -c "
        echo 'Waiting for services...' &&
        sleep 10 &&
        echo 'Running E2E tests...' &&
        pnpm run cypress:run
      "
    profiles:
      - e2e

networks:
  gazette-test-network:
    driver: bridge

volumes:
  test_postgres_data:
    driver: local