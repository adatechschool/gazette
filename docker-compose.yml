services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - '${DB_PORT}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - gazette-network
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U ${DB_USER} -d ${DB_NAME}']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    env_file:
      - .env
    environment:
      # Variables spécifiques au conteneur
      DB_HOST: postgres
      DB_PORT: 5432
      NODE_ENV: development
    ports:
      - '${BACKEND_PORT}:${BACKEND_PORT}'
    volumes:
      # Monter le code source pour hot reload
      - ./apps/backend:/gazette/apps/backend:delegated
      - ./packages/shared:/gazette/packages/shared:delegated
      - ./package.json:/gazette/package.json:ro
      - ./pnpm-workspace.yaml:/gazette/pnpm-workspace.yaml:ro
      - ./pnpm-lock.yaml:/gazette/pnpm-lock.yaml:ro
      # Éviter de monter node_modules (utiliser celui du conteneur)
      - /gazette/node_modules
      - /gazette/apps/backend/node_modules
      - /gazette/packages/shared/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - gazette-network
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    environment:
      # API URL pour le navigateur (côté client)
      NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT}
      # API URL pour Next.js serveur (dans le conteneur)
      INTERNAL_API_URL: http://backend:${BACKEND_PORT}
      NODE_ENV: development
      PORT: ${FRONTEND_PORT:-3002}
      NEXT_TELEMETRY_DISABLED: 1
      WATCHPACK_POLLING: 1000
      NODE_OPTIONS: --max-old-space-size=2048
      # Optimisations Next.js pour Docker
      NEXT_WEBPACK_USEPOLLING: 1
      CHOKIDAR_USEPOLLING: 1
    ports:
      - '${FRONTEND_PORT:-3002}:${FRONTEND_PORT:-3002}'
    volumes:
      # Monter le code source pour hot reload
      - ./apps/frontend:/gazette/apps/frontend:delegated
      - ./packages/shared:/gazette/packages/shared:delegated
      - ./package.json:/gazette/package.json:ro
      - ./pnpm-workspace.yaml:/gazette/pnpm-workspace.yaml:ro
      - ./pnpm-lock.yaml:/gazette/pnpm-lock.yaml:ro
      # Éviter de monter node_modules
      - /gazette/node_modules
      - /gazette/apps/frontend/node_modules
      - /gazette/packages/shared/node_modules
    depends_on:
      - backend
    networks:
      - gazette-network
    restart: unless-stopped

  adminer:
    image: adminer
    ports:
      - '8080:8080'
    networks:
      - gazette-network
    depends_on:
      - postgres
    restart: unless-stopped

networks:
  gazette-network:
    driver: bridge

volumes:
  postgres_data:
  