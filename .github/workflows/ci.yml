name: CI

on:
  push:
    branches:
      - main
      - staging
      - dev
      - branche-de-france
  pull_request:
    branches:
      - main
      - staging
      - dev
      - branche-de-france

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.15.0

      - name: Setup pnpm
        run: npm install -g pnpm@10.11.0

      - name: Install dependencies
        run: pnpm ci:install

      - name: Run ESLint
        run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.15.0

      - name: Setup pnpm
        run: npm install -g pnpm@10.11.0

      - name: Install dependencies
        run: pnpm ci:install && pnpm ci:prebuild && pnpm ci:build

      - name: Run TypeScript typecheck
        run: pnpm typecheck

  build:
    needs: typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.15.0

      - name: Setup pnpm
        run: npm install -g pnpm@10.11.0

      - name: Install dependencies
        run: pnpm ci:install

      - name: Build all packages
        env:
          NODE_ENV: production
          CI: true
        run: pnpm ci:build

  tests:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.15.0

      - name: Setup pnpm
        run: npm install -g pnpm@10.11.0

      - name: Install dependencies
        run: pnpm ci:install

      - name: Run unit tests
        working-directory: packages/shared
        run: pnpm test

  playwright:
    needs: tests
    timeout-minutes: 60
    runs-on: ubuntu-latest

    # Service PostgreSQL géré par GitHub Actions
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
          POSTGRES_USER: ${{ secrets.DB_USER }}
          POSTGRES_DB: ${{ secrets.DB_NAME }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.15.0

      - name: Setup pnpm
        run: npm install -g pnpm@10.11.0

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y lsof

      - name: Install dependencies
        run: pnpm ci:install

      - name: Install Playwright Browsers
        run: pnpm --filter gazette_backend exec playwright install --with-deps

      - name: Create .env file for CI
        run: |
          cat > .env << EOF
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_NAME=${{ secrets.DB_NAME }}
          DB_PORT=5432
          DB_HOST=localhost
          BACKEND_PORT=${{ secrets.BACKEND_PORT }}
          NODE_ENV=test
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          JWT_EXPIRATION=${{ secrets.JWT_EXPIRATION }}
          ALLOWED_ORIGINS=${{ secrets.ALLOWED_ORIGINS }}
          FRONTEND_PORT=${{ secrets.FRONTEND_PORT }}
          NEXT_PUBLIC_API_URL=http://localhost:${{ secrets.BACKEND_PORT }}
          DATABASE_URL=postgresql://${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@localhost:5432/${{ secrets.DB_NAME }}
          EOF

      - name: Wait for PostgreSQL
        run: |
          echo "Waiting for PostgreSQL to be ready..."
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U ${{ secrets.DB_USER }}; then
              echo "✅ PostgreSQL is ready!"
              break
            fi
            echo "Waiting for PostgreSQL... ($i/30)"
            sleep 2
          done

      - name: Build applications
        run: pnpm ci:build

      - name: Setup database
        env:
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_HOST: localhost
          DB_PORT: 5432
          DATABASE_URL: postgresql://${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@localhost:5432/${{ secrets.DB_NAME }}
        run: |
          echo "Setting up database..."
          pnpm db:setup

      - name: Start Backend
        env:
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_PORT: 5432
          DB_HOST: localhost
          BACKEND_PORT: ${{ secrets.BACKEND_PORT }}
          NODE_ENV: test
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRATION: ${{ secrets.JWT_EXPIRATION }}
          ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
          DATABASE_URL: postgresql://${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@localhost:5432/${{ secrets.DB_NAME }}
        run: |
          echo "Starting backend..."
          cd apps/backend

          # Copy .env file to backend directory
          cp ../../.env ./.env

          # Verify environment variables
          echo "Verifying environment variables..."
          echo "DB_NAME: $DB_NAME"
          echo "DB_HOST: $DB_HOST"
          echo "DB_PORT: $DB_PORT"

          # Start the backend with explicit environment variables
          NODE_ENV=test \
          DB_NAME=$DB_NAME \
          DB_USER=$DB_USER \
          DB_PASSWORD=$DB_PASSWORD \
          DB_HOST=$DB_HOST \
          DB_PORT=$DB_PORT \
          BACKEND_PORT=$BACKEND_PORT \
          JWT_SECRET=$JWT_SECRET \
          JWT_EXPIRATION=$JWT_EXPIRATION \
          ALLOWED_ORIGINS=$ALLOWED_ORIGINS \
          DATABASE_URL=$DATABASE_URL \
          nohup pnpm start > ../../backend.log 2>&1 &
          echo $! > ../../backend.pid

          # Give it a moment to start
          sleep 2

          # Check if process is still running
          if ! ps -p $(cat ../../backend.pid) > /dev/null; then
            echo "❌ Backend process failed to start"
            echo "Backend logs:"
            cat ../../backend.log
            exit 1
          fi

          echo "Waiting for backend to be ready..."
          for i in {1..60}; do
            if curl -f http://localhost:${{ secrets.BACKEND_PORT }}/health 2>/dev/null; then
              echo "✅ Backend is ready!"
              break
            elif [ $i -eq 60 ]; then
              echo "❌ Backend failed to start within 60 attempts"
              echo "Backend logs:"
              cat ../../backend.log
              # Also show running processes for debugging
              echo "Process status:"
              ps aux | grep node
              exit 1
            fi
            echo "Waiting for backend... ($i/60)"

            # Check if process died while waiting
            if ! ps -p $(cat ../../backend.pid) > /dev/null; then
              echo "❌ Backend process died while waiting"
              echo "Backend logs:"
              cat ../../backend.log
              exit 1
            fi

            sleep 2
          done

      - name: Start Frontend
        env:
          FRONTEND_PORT: ${{ secrets.FRONTEND_PORT }}
          NEXT_PUBLIC_API_URL: http://localhost:${{ secrets.BACKEND_PORT }}
          NODE_ENV: test
        run: |
          echo "Starting frontend..."

          # Check if port is in use and kill the process if it exists
          echo "Checking if port $FRONTEND_PORT is in use..."
          if lsof -i :$FRONTEND_PORT; then
            echo "Port $FRONTEND_PORT is in use. Attempting to free it..."
            sudo fuser -k $FRONTEND_PORT/tcp || true
            sleep 2
          fi

          cd apps/frontend

          # Copy .env file to frontend directory
          cp ../../.env ./.env

          # Verify environment variables
          echo "Verifying environment variables..."
          echo "FRONTEND_PORT: $FRONTEND_PORT"
          echo "NEXT_PUBLIC_API_URL: $NEXT_PUBLIC_API_URL"

          # Start the frontend with explicit environment variables
          FRONTEND_PORT=$FRONTEND_PORT \
          NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL \
          NODE_ENV=$NODE_ENV \
          nohup pnpm start > ../../frontend.log 2>&1 &
          echo $! > ../../frontend.pid

          # Give it a moment to start
          sleep 2

          # Check if process is still running
          if ! ps -p $(cat ../../frontend.pid) > /dev/null; then
            echo "❌ Frontend process failed to start"
            echo "Frontend logs:"
            cat ../../frontend.log
            exit 1
          fi

          echo "Waiting for frontend to be ready..."
          for i in {1..60}; do
            if curl -f http://localhost:${{ secrets.FRONTEND_PORT }} 2>/dev/null; then
              echo "✅ Frontend is ready!"
              break
            elif [ $i -eq 60 ]; then
              echo "❌ Frontend failed to start within 60 attempts"
              echo "Frontend logs:"
              cat ../../frontend.log
              # Also show running processes for debugging
              echo "Process status:"
              ps aux | grep node
              exit 1
            fi
            echo "Waiting for frontend... ($i/60)"

            # Check if process died while waiting
            if ! ps -p $(cat ../../frontend.pid) > /dev/null; then
              echo "❌ Frontend process died while waiting"
              echo "Frontend logs:"
              cat ../../frontend.log
              exit 1
            fi

            sleep 3
          done

      - name: Verify services are accessible
        run: |
          echo "=== Final health checks ==="
          echo "Backend health check:"
          curl -f http://localhost:${{ secrets.BACKEND_PORT }}/health || exit 1

          echo "Frontend accessibility:"
          curl -f http://localhost:${{ secrets.FRONTEND_PORT }} || exit 1

          echo "✅ All services are ready for testing!"

      - name: Run Playwright tests
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:${{ secrets.FRONTEND_PORT }}
          API_URL: http://localhost:${{ secrets.BACKEND_PORT }}
        run: |
          echo "Running Playwright tests..."
          pnpm test:e2e --reporter=html

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: ./apps/backend/playwright-report/
          retention-days: 30

      - name: Show logs on failure
        if: failure()
        run: |
          echo "=== Backend logs ==="
          cat backend.log 2>/dev/null || echo "No backend logs found"
          echo "=== Frontend logs ==="
          cat frontend.log 2>/dev/null || echo "No frontend logs found"

      - name: Cleanup
        if: always()
        run: |
          echo "Cleaning up processes..."
          [ -f backend.pid ] && kill $(cat backend.pid) 2>/dev/null || echo "No backend process to kill"
          [ -f frontend.pid ] && kill $(cat frontend.pid) 2>/dev/null || echo "No frontend process to kill"

  lighthouse:
    name: Lighthouse Accessibility Audit
    needs: playwright
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
          POSTGRES_USER: ${{ secrets.DB_USER }}
          POSTGRES_DB: ${{ secrets.DB_NAME }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.15.0

      - name: Setup pnpm
        run: npm install -g pnpm@10.11.0

      - name: Install dependencies
        run: pnpm ci:install

      - name: Create .env file for CI
        run: |
          cat > .env << EOF
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_NAME=${{ secrets.DB_NAME }}
          DB_PORT=5432
          DB_HOST=localhost
          BACKEND_PORT=${{ secrets.BACKEND_PORT }}
          NODE_ENV=test
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          JWT_EXPIRATION=${{ secrets.JWT_EXPIRATION }}
          ALLOWED_ORIGINS=${{ secrets.ALLOWED_ORIGINS }}
          FRONTEND_PORT=${{ secrets.FRONTEND_PORT }}
          NEXT_PUBLIC_API_URL=http://localhost:${{ secrets.BACKEND_PORT }}
          DATABASE_URL=postgresql://${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@localhost:5432/${{ secrets.DB_NAME }}
          EOF

      - name: Wait for PostgreSQL and setup database
        run: |
          echo "Waiting for PostgreSQL..."
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U ${{ secrets.DB_USER }}; then
              echo "✅ PostgreSQL is ready!"
              break
            fi
            sleep 2
          done

      - name: Build and start applications
        run: |
          # Build all packages
          pnpm ci:build

          # Setup database
          pnpm db:setup

          # Start backend
          cd apps/backend
          nohup pnpm start > ../../backend.log 2>&1 &

          # Start frontend
          cd ../frontend
          nohup pnpm start > ../../frontend.log 2>&1 &

          # Wait for services
          echo "Waiting for services to start..."
          sleep 45

          # Verify services
          if ! curl -f http://localhost:${{ secrets.BACKEND_PORT }}/health 2>/dev/null; then
            echo "❌ Backend not ready"
            echo "Backend logs:"
            cat backend.log
            exit 1
          fi

          if ! curl -f http://localhost:${{ secrets.FRONTEND_PORT }} 2>/dev/null; then
            echo "❌ Frontend not ready"
            echo "Frontend logs:"
            cat frontend.log
            exit 1
          fi

          echo "✅ All services ready for Lighthouse!"

      - name: Run Lighthouse CI
        env:
          FRONTEND_PORT: ${{ secrets.FRONTEND_PORT }}
        run: |
          npm install -g @lhci/cli@0.15.x
          lhci collect --url=http://localhost:${{ secrets.FRONTEND_PORT }}/
          lhci upload --target=temporary-public-storage
