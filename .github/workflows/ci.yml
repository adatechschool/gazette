name: CI

on:
  push:
    branches:
      - main
      - staging
      - dev
      - branche-de-france
  pull_request:
    branches:
      - main
      - staging
      - dev
      - branche-de-france

# 🎯 VARIABLES GLOBALES : disponibles dans tous les jobs
env:
  # Versions des outils
  NODE_VERSION: 22.15.0
  PNPM_VERSION: 10.12.4

  # Configuration de l'environnement
  NODE_ENV: test
  DB_PORT: 5432
  DB_HOST: localhost

  # Timeouts (en minutes)
  SERVICE_TIMEOUT: 60

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: Run ESLint
        run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: Build packages for typecheck
        run: pnpm ci:prebuild && pnpm ci:build

      - name: Run TypeScript typecheck
        run: pnpm typecheck

  build:
    needs: [lint, typecheck]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: Build all packages
        env:
          NODE_ENV: production
          CI: true
        run: pnpm ci:build

  tests:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: Run unit tests
        working-directory: packages/shared
        run: pnpm test

  playwright:
    needs: tests
    timeout-minutes: 60
    runs-on: ubuntu-latest

    env:
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_NAME: ${{ secrets.DB_NAME }}
      BACKEND_PORT: ${{ secrets.BACKEND_PORT }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      JWT_EXPIRATION: ${{ secrets.JWT_EXPIRATION }}
      ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
      FRONTEND_PORT: ${{ secrets.FRONTEND_PORT }}
      # Variables calculées
      DATABASE_URL: postgresql://${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@localhost:5432/${{ secrets.DB_NAME }}
      NEXT_PUBLIC_API_URL: http://localhost:${{ secrets.BACKEND_PORT }}

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
          POSTGRES_USER: ${{ secrets.DB_USER }}
          POSTGRES_DB: ${{ secrets.DB_NAME }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y lsof

      - name: Install Playwright Browsers
        run: pnpm --filter gazette_backend exec playwright install --with-deps

      - name: Create environment file
        uses: ./.github/actions/create-env-file

      - name: Setup services
        uses: ./.github/actions/setup-services

      - name: Build applications
        run: pnpm ci:build

      - name: Start Backend
        run: |
          echo "Starting backend..."
          cd apps/backend

          # Copy .env file to backend directory
          cp ../../.env ./.env

          # Verify environment variables (sans exposer les secrets)
          echo "Verifying environment variables..."
          echo "DB_NAME: $DB_NAME"
          echo "DB_HOST: ${{ env.DB_HOST }}"
          echo "DB_PORT: ${{ env.DB_PORT }}"

          # Start the backend with explicit environment variables
          NODE_ENV=${{ env.NODE_ENV }} \
          DB_NAME=$DB_NAME \
          DB_USER=$DB_USER \
          DB_PASSWORD=$DB_PASSWORD \
          DB_HOST=${{ env.DB_HOST }} \
          DB_PORT=${{ env.DB_PORT }} \
          BACKEND_PORT=$BACKEND_PORT \
          JWT_SECRET=$JWT_SECRET \
          JWT_EXPIRATION=$JWT_EXPIRATION \
          ALLOWED_ORIGINS=$ALLOWED_ORIGINS \
          DATABASE_URL=$DATABASE_URL \
          nohup pnpm start > ../../backend.log 2>&1 &
          echo $! > ../../backend.pid

          # Give it a moment to start
          sleep 2

          # Check if process is still running
          if ! ps -p $(cat ../../backend.pid) > /dev/null; then
            echo "❌ Backend process failed to start"
            echo "Backend logs:"
            cat ../../backend.log
            exit 1
          fi

          echo "Waiting for backend to be ready..."
          for i in {1..60}; do
            if curl -f http://localhost:$BACKEND_PORT/health 2>/dev/null; then
              echo "✅ Backend is ready!"
              break
            elif [ $i -eq 60 ]; then
              echo "❌ Backend failed to start within 60 attempts"
              echo "Backend logs:"
              cat ../../backend.log
              # Also show running processes for debugging
              echo "Process status:"
              ps aux | grep node
              exit 1
            fi
            echo "Waiting for backend... ($i/60)"

            # Check if process died while waiting
            if ! ps -p $(cat ../../backend.pid) > /dev/null; then
              echo "❌ Backend process died while waiting"
              echo "Backend logs:"
              cat ../../backend.log
              exit 1
            fi

            sleep 2
          done

      - name: Start Frontend
        run: |
          echo "Starting frontend..."

          # Check if port is in use and kill the process if it exists
          echo "Checking if port $FRONTEND_PORT is in use..."
          if lsof -i :$FRONTEND_PORT; then
            echo "Port $FRONTEND_PORT is in use. Attempting to free it..."
            sudo fuser -k $FRONTEND_PORT/tcp || true
            sleep 2
          fi

          cd apps/frontend

          # Copy .env file to frontend directory
          cp ../../.env ./.env

          # Verify environment variables (sans exposer les secrets)
          echo "Verifying environment variables..."
          echo "FRONTEND_PORT: $FRONTEND_PORT"
          echo "NEXT_PUBLIC_API_URL: $NEXT_PUBLIC_API_URL"

          # Start the frontend with explicit environment variables and port
          FRONTEND_PORT=$FRONTEND_PORT \
          NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL \
          NODE_ENV=${{ env.NODE_ENV }} \
          nohup pnpm start -p $FRONTEND_PORT > ../../frontend.log 2>&1 &
          echo $! > ../../frontend.pid

          # Give it a moment to start
          sleep 2

          # Check if process is still running
          if ! ps -p $(cat ../../frontend.pid) > /dev/null; then
            echo "❌ Frontend process failed to start"
            echo "Frontend logs:"
            cat ../../frontend.log
            exit 1
          fi

          echo "Waiting for frontend to be ready..."
          for i in {1..60}; do
            if curl -f http://localhost:$FRONTEND_PORT 2>/dev/null; then
              echo "✅ Frontend is ready!"
              break
            elif [ $i -eq 60 ]; then
              echo "❌ Frontend failed to start within 60 attempts"
              echo "Frontend logs:"
              cat ../../frontend.log
              # Also show running processes for debugging
              echo "Process status:"
              ps aux | grep node
              exit 1
            fi
            echo "Waiting for frontend... ($i/60)"

            # Check if process died while waiting
            if ! ps -p $(cat ../../frontend.pid) > /dev/null; then
              echo "❌ Frontend process died while waiting"
              echo "Frontend logs:"
              cat ../../frontend.log
              exit 1
            fi

            sleep 3
          done

      - name: Verify services are accessible
        run: |
          echo "=== Final health checks ==="
          echo "Backend health check:"
          curl -f http://localhost:$BACKEND_PORT/health || exit 1

          echo "Frontend accessibility:"
          curl -f http://localhost:$FRONTEND_PORT || exit 1

          echo "✅ All services are ready for testing!"

      - name: Run Playwright tests
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:${{ env.FRONTEND_PORT }}
          API_URL: http://localhost:${{ env.BACKEND_PORT }}
        run: |
          echo "Running Playwright tests..."
          pnpm test:e2e --reporter=html

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: ./apps/backend/playwright-report/
          retention-days: 30

      - name: Show logs on failure
        if: failure()
        run: |
          echo "=== Backend logs ==="
          cat backend.log 2>/dev/null || echo "No backend logs found"
          echo "=== Frontend logs ==="
          cat frontend.log 2>/dev/null || echo "No frontend logs found"

      - name: Cleanup
        if: always()
        run: |
          echo "Cleaning up processes..."
          [ -f backend.pid ] && kill $(cat backend.pid) 2>/dev/null || echo "No backend process to kill"
          [ -f frontend.pid ] && kill $(cat frontend.pid) 2>/dev/null || echo "No frontend process to kill"

  lighthouse:
    name: Lighthouse Accessibility Audit
    needs: playwright
    runs-on: ubuntu-latest

    env:
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_NAME: ${{ secrets.DB_NAME }}
      BACKEND_PORT: ${{ secrets.BACKEND_PORT }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      JWT_EXPIRATION: ${{ secrets.JWT_EXPIRATION }}
      ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
      FRONTEND_PORT: ${{ secrets.FRONTEND_PORT }}
      DATABASE_URL: postgresql://${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@localhost:5432/${{ secrets.DB_NAME }}
      NEXT_PUBLIC_API_URL: http://localhost:${{ secrets.BACKEND_PORT }}

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
          POSTGRES_USER: ${{ secrets.DB_USER }}
          POSTGRES_DB: ${{ secrets.DB_NAME }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: Create environment file
        uses: ./.github/actions/create-env-file

      - name: Setup services
        uses: ./.github/actions/setup-services

      - name: Build and start applications
        run: |
          # Build all packages
          pnpm ci:build

          # Start backend with proper environment
          cd apps/backend
          echo "Starting backend from $(pwd)"
          NODE_ENV=${{ env.NODE_ENV }} \
          DB_NAME=$DB_NAME \
          DB_USER=$DB_USER \
          DB_PASSWORD=$DB_PASSWORD \
          DB_HOST=${{ env.DB_HOST }} \
          DB_PORT=${{ env.DB_PORT }} \
          BACKEND_PORT=$BACKEND_PORT \
          JWT_SECRET=$JWT_SECRET \
          JWT_EXPIRATION=$JWT_EXPIRATION \
          ALLOWED_ORIGINS=$ALLOWED_ORIGINS \
          DATABASE_URL=$DATABASE_URL \
          nohup pnpm start > ../../backend.log 2>&1 &
          BACKEND_PID=$!
          echo $BACKEND_PID > ../../backend.pid

          # Give backend a moment to start
          sleep 5

          # Check if backend process is running
          if ! ps -p $BACKEND_PID > /dev/null; then
            echo "❌ Backend process failed to start"
            echo "Backend logs:"
            cat ../../backend.log
            exit 1
          fi

          # Start frontend with proper environment
          cd ../frontend
          echo "Starting frontend from $(pwd)"
          FRONTEND_PORT=$FRONTEND_PORT \
          NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL \
          NODE_ENV=${{ env.NODE_ENV }} \
          nohup pnpm start -p $FRONTEND_PORT > ../../frontend.log 2>&1 &
          FRONTEND_PID=$!
          echo $FRONTEND_PID > ../../frontend.pid

          cd ../..
          echo "Current directory: $(pwd)"

          # Wait for services with better error handling
          echo "Waiting for services to start..."

          echo "Checking backend..."
          for i in {1..30}; do
            if curl -f http://localhost:$BACKEND_PORT/health 2>/dev/null; then
              echo "✅ Backend is ready!"
              break
            elif [ $i -eq 30 ]; then
              echo "❌ Backend failed to start within 30 attempts"
              echo "Backend logs:"
              cat backend.log || echo "No backend log file found"
              echo "Process status:"
              ps aux | grep node
              exit 1
            fi
            echo "Waiting for backend... ($i/30)"

            # Check if process died
            if ! ps -p $(cat backend.pid) > /dev/null; then
              echo "❌ Backend process died"
              echo "Backend logs:"
              cat backend.log || echo "No backend log file found"
              exit 1
            fi

            sleep 2
          done

          echo "Checking frontend..."
          for i in {1..30}; do
            if curl -f http://localhost:$FRONTEND_PORT 2>/dev/null; then
              echo "✅ Frontend is ready!"
              break
            elif [ $i -eq 30 ]; then
              echo "❌ Frontend failed to start within 30 attempts"
              echo "Frontend logs:"
              cat frontend.log || echo "No frontend log file found"
              echo "Process status:"
              ps aux | grep node
              exit 1
            fi
            echo "Waiting for frontend... ($i/30)"

            # Check if process died
            if ! ps -p $(cat frontend.pid) > /dev/null; then
              echo "❌ Frontend process died"
              echo "Frontend logs:"
              cat frontend.log || echo "No frontend log file found"
              exit 1
            fi

            sleep 2
          done

          echo "✅ All services ready for Lighthouse!"

          # Show running processes for verification
          echo "Running processes:"
          ps aux | grep node

      - name: Run Lighthouse CI
        run: |
          npm install -g @lhci/cli@0.15.x
          lhci collect --url=http://localhost:$FRONTEND_PORT/
          lhci upload --target=temporary-public-storage
